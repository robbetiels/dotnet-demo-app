services:
  todoappdb:
    image: mariadb:11
    container_name: todoappdb
    environment:
      MARIADB_ROOT_PASSWORD: sekrit
      MARIADB_DATABASE: todo_db
      MARIADB_USER: todo_usr
      MARIADB_PASSWORD: letmeinplz
    volumes:
      - mariadb-data:/var/lib/mysql:Z
      - ./TodoApp/schema.sql:/docker-entrypoint-initdb.d/schema.sql:Z,ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  todoapp:
    build:
      context: ./TodoApp
    container_name: todoapp
    depends_on:
      todoappdb:
        condition: service_healthy
    environment:
      ConnectionStrings__TodoDb: "Server=todoappdb;Port=3306;Database=todo_db;User=todo_usr;Password=letmeinplz;"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8081:8080"

volumes:
  mariadb-data: